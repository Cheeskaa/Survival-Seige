
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  #stage {
    width: 100%;
    height: 520px;
    background: #0a1a0a;
    position: relative;
    overflow: hidden;
    font-family: Georgia, serif;
  }
  #sky {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, #1a2e1a 0%, #0a1a0a 60%, #000 100%);
  }
  #stars { position: absolute; inset: 0; }
  #trees-bg { position: absolute; bottom: 0; left: 0; right: 0; }
  #vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }
  #lid-top {
    position: absolute; left: 0; right: 0; top: 0;
    background: #000;
    height: 50%;
    transform-origin: top;
    transition: height 0.4s ease;
    z-index: 10;
  }
  #lid-bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #000;
    height: 50%;
    transform-origin: bottom;
    transition: height 0.4s ease;
    z-index: 10;
  }
  #story-text {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(220, 210, 180, 0);
    font-size: 18px;
    font-style: italic;
    text-align: center;
    width: 80%;
    text-shadow: 0 0 20px rgba(0,0,0,1), 0 2px 8px rgba(0,0,0,0.9);
    z-index: 20;
    transition: color 0.6s ease;
    line-height: 1.6;
  }
  #skip-btn {
    position: absolute;
    bottom: 20px;
    right: 24px;
    z-index: 30;
    background: transparent;
    border: 1px solid rgba(200,190,160,0.4);
    color: rgba(200,190,160,0.6);
    padding: 6px 16px;
    font-size: 13px;
    font-family: Georgia, serif;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s;
  }
  #skip-btn:hover { color: rgba(200,190,160,1); border-color: rgba(200,190,160,0.8); }
  #replay-btn {
    display: none;
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: transparent;
    border: 1px solid rgba(200,190,160,0.5);
    color: rgba(200,190,160,0.8);
    padding: 8px 24px;
    font-size: 14px;
    font-family: Georgia, serif;
    cursor: pointer;
    border-radius: 4px;
  }
  #progress {
    position: absolute;
    bottom: 28px;
    left: 24px;
    z-index: 30;
    color: rgba(200,190,160,0.35);
    font-size: 12px;
    font-family: Georgia, serif;
    font-style: italic;
  }
  .firefly {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #ffe87a;
    box-shadow: 0 0 6px 2px #ffe87a;
    opacity: 0;
    animation: firefly-anim 4s ease-in-out infinite;
  }
  @keyframes firefly-anim {
    0%   { opacity: 0; transform: translate(0,0); }
    20%  { opacity: 0.9; }
    50%  { opacity: 0.5; transform: translate(var(--dx), var(--dy)); }
    80%  { opacity: 0.8; }
    100% { opacity: 0; transform: translate(0,0); }
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>

<div id="stage">
  <div id="sky"></div>
  <canvas id="stars" width="680" height="520"></canvas>
  <svg id="trees-bg" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" height="220">
    <polygon points="40,220 80,100 120,220" fill="#071507"/>
    <polygon points="60,220 110,60 160,220" fill="#091a09"/>
    <polygon points="55,220 105,90 155,220" fill="#071507"/>
    <polygon points="150,220 200,80 250,220" fill="#0a1e0a"/>
    <polygon points="170,220 230,50 290,220" fill="#071507"/>
    <polygon points="250,220 310,90 370,220" fill="#091a09"/>
    <polygon points="320,220 380,65 440,220" fill="#0a1e0a"/>
    <polygon points="380,220 430,100 480,220" fill="#071507"/>
    <polygon points="430,220 490,55 550,220" fill="#091a09"/>
    <polygon points="500,220 555,85 610,220" fill="#0a1e0a"/>
    <polygon points="560,220 610,100 660,220" fill="#071507"/>
    <polygon points="580,220 630,70 680,220" fill="#091a09"/>
    <rect x="0" y="200" width="680" height="20" fill="#050f05"/>
  </svg>
  <div id="vignette"></div>
  <div id="lid-top"></div>
  <div id="lid-bottom"></div>
  <div id="story-text"></div>
  <div id="progress"></div>
  <button id="skip-btn" onclick="skipToEnd()">skip ›</button>
  <button id="replay-btn" onclick="replay()">replay intro</button>
</div>

<script>
const lines = [
  "...",
  "Where... am I?",
  "The air smells of pine and earth.",
  "My head is pounding.",
  "I can't remember anything.",
  "Not my name. Not my home.",
  "Nothing.",
  "But I'm alive.",
  "The forest stretches endlessly around me.",
  "Strange creatures lurk in the shadows.",
  "And the sun... it's already starting to set.",
  "I don't know how I got here.",
  "But I know one thing.",
  "I have to survive."
];

let currentLine = 0;
let running = true;
let blinkTimer = null;

const lidTop = document.getElementById('lid-top');
const lidBot = document.getElementById('lid-bottom');
const txt = document.getElementById('story-text');
const prog = document.getElementById('progress');

function wait(ms) {
  return new Promise(res => {
    if (!running) { res(); return; }
    setTimeout(res, ms);
  });
}

function setLids(topH, botH, dur) {
  lidTop.style.transition = `height ${dur}s ease`;
  lidBot.style.transition = `height ${dur}s ease`;
  lidTop.style.height = topH + '%';
  lidBot.style.height = botH + '%';
}

function showText(line) {
  txt.textContent = line;
  txt.style.color = 'rgba(220,210,180,0)';
  setTimeout(() => { txt.style.color = 'rgba(220,210,180,0.95)'; }, 50);
}

function hideText() {
  txt.style.color = 'rgba(220,210,180,0)';
}

async function doBlink(topOpen, botOpen, openDur, holdDur, closeDur) {
  setLids(50 - topOpen, 50 - botOpen, openDur);
  await wait(openDur * 1000 + holdDur);
  setLids(50, 50, closeDur);
  await wait(closeDur * 1000 + 100);
}

async function blinkLoop() {
  while (running) {
    const delay = 800 + Math.random() * 2700;
    await wait(delay);
    if (!running) break;
    const type = Math.floor(Math.random() * 3);
    if (type === 0) {
      await doBlink(3, 1, 0.08, 100, 0.05);
    } else if (type === 1) {
      await doBlink(8, 3, 0.4, 200, 0.2);
    } else {
      await doBlink(22, 6, 1.2, 600, 0.2);
    }
  }
}

async function runStory() {
  prog.textContent = '';
  setLids(50, 50, 0);
  await wait(600);

  setLids(5, 5, 1.5);
  await wait(1600);
  setLids(50, 50, 0.3);
  await wait(500);

  for (let i = 0; i < lines.length; i++) {
    if (!running) break;
    currentLine = i;
    prog.textContent = (i + 1) + ' / ' + lines.length;

    const openAmt = 10 + Math.random() * 18;
    setLids(50 - openAmt, 50 - openAmt * 0.4, 0.6);
    await wait(700);

    showText(lines[i]);
    await wait(2400);
    hideText();
    await wait(500);

    setLids(50, 50, 0.25);
    await wait(400);
  }

  if (running) {
    prog.textContent = '';
    setLids(0, 0, 1.2);
    await wait(1300);
    txt.style.color = 'rgba(220,210,180,0)';
    txt.textContent = 'Your story begins now.';
    txt.style.fontStyle = 'normal';
    txt.style.fontSize = '22px';
    txt.style.letterSpacing = '2px';
    txt.style.transition = 'color 1.2s ease';
    txt.style.color = 'rgba(220,210,180,0.95)';
    await wait(2500);
    document.getElementById('skip-btn').style.display = 'none';
    document.getElementById('replay-btn').style.display = 'block';
    prog.textContent = '';
  }
}

function skipToEnd() {
  running = false;
  setLids(0, 0, 0.5);
  setTimeout(() => {
    txt.style.color = 'rgba(220,210,180,0)';
    txt.textContent = 'Your story begins now.';
    txt.style.fontStyle = 'normal';
    txt.style.fontSize = '22px';
    txt.style.letterSpacing = '2px';
    txt.style.transition = 'color 1.2s ease';
    setTimeout(() => { txt.style.color = 'rgba(220,210,180,0.95)'; }, 100);
    document.getElementById('skip-btn').style.display = 'none';
    document.getElementById('replay-btn').style.display = 'block';
    prog.textContent = '';
  }, 600);
}

function replay() {
  running = true;
  document.getElementById('replay-btn').style.display = 'none';
  document.getElementById('skip-btn').style.display = 'block';
  txt.style.fontSize = '18px';
  txt.style.fontStyle = 'italic';
  txt.style.letterSpacing = '0';
  runStory();
  blinkLoop();
}

const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
for (let i = 0; i < 80; i++) {
  const x = Math.random() * 680;
  const y = Math.random() * 300;
  const r = Math.random() * 1.2;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,240,${0.3 + Math.random() * 0.6})`;
  ctx.fill();
}

const stage = document.getElementById('stage');
for (let i = 0; i < 10; i++) {
  const f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = (15 + Math.random() * 70) + '%';
  f.style.top = (30 + Math.random() * 40) + '%';
  f.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
  f.style.setProperty('--dy', (Math.random() * 30 - 15) + 'px');
  f.style.animationDelay = (Math.random() * 4) + 's';
  f.style.animationDuration = (3 + Math.random() * 3) + 's';
  stage.appendChild(f);
}

runStory();
blinkLoop();
</script>
